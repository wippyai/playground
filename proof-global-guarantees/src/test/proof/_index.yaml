version: "1.0"
namespace: app.test.proof

entries:
  - name: ultimate_global_guarantee
    kind: function.lua
    meta:
      type: test
      suite: proof
      description: "PRIMARY PROOF: process.registry.register(name, process.registry.GLOBAL) guarantees single ownership"
      order: 1
    source: file://ultimate_global_guarantee.lua
    method: main
    modules:
      - exec
      - process
      - time
    imports:
      assert: app.lib:assert
      cluster: app.lib:cluster

