version: "1.0"
namespace: app

entries:
  # app:terminal - terminal host for CLI commands
  - name: terminal
    kind: terminal.host
    hide_logs: false
    lifecycle:
      auto_start: true

  # app:processes - process host for spawning workers
  - name: processes
    kind: process.host
    host:
      max_processes: 100
      workers: 8
    lifecycle:
      auto_start: true

  # app:test_runner - runs all global registry tests
  - name: test_runner
    kind: process.lua
    meta:
      command:
        name: test
        short: Run global registry checklist tests
    source: file://runner.lua
    method: main
    modules:
      - io
      - registry
      - funcs
      - time
