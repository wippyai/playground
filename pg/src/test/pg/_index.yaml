version: "1.0"
namespace: app.test.pg

entries:
  # --- test cases ---

  - name: join_leave
    kind: function.lua
    meta:
      type: test
      suite: pg
      description: "join and leave a group"
      order: 1
    source: file://join_leave.lua
    method: main
    imports:
      assert: app.lib:assert
    modules:
      - pg

  - name: multi_join
    kind: function.lua
    meta:
      type: test
      suite: pg
      description: "multi-join same group (PID appears multiple times)"
      order: 2
    source: file://multi_join.lua
    method: main
    imports:
      assert: app.lib:assert
    modules:
      - pg

  - name: which_groups
    kind: function.lua
    meta:
      type: test
      suite: pg
      description: "which_groups lists all active groups"
      order: 3
    source: file://which_groups.lua
    method: main
    imports:
      assert: app.lib:assert
    modules:
      - pg

  - name: members
    kind: function.lua
