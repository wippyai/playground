      order: 5
    source: file://broadcast.lua
    method: main
    imports:
      assert: app.lib:assert
    modules:
      - pg
      - process
      - time
      - channel

  - name: broadcast_local
    kind: function.lua
    meta:
      type: test
      suite: pg
      description: "broadcast_local delivers to local members only"
      order: 6
    source: file://broadcast_local.lua
    method: main
    imports:
      assert: app.lib:assert
    modules:
      - pg
      - process
      - time
      - channel

